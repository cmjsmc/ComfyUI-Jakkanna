name: Publish to Comfy registry
on:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish-node:
    name: Publish Custom Node to registry
    needs: test
    runs-on: ubuntu-latest
    env:
      COMFY_NODE_CHANGELOG: >-
        Adds a four-input image-and-FBX SCAIL-2 workflow with production-safe
        full, American, medium, close, and Dutch-roll camera presets; binds the
        selected preset to reference/driver registration, cache identity,
        validation, and reproducibility manifests.
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
