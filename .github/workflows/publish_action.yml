name: Publish to Comfy registry
on:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish-node:
    name: Publish Custom Node to registry
    needs: test
    runs-on: ubuntu-latest
    env:
      COMFY_NODE_CHANGELOG: >-
        Preserves each pose's camera framing across editing, library,
        import/export, and workflow reload operations. Batches animation
        capture without resizing the WebGL renderer for every frame, and
        routes Mixamo through the shared world-landmark projection with finger
        and toe-base landmarks plus explicit incomplete-capture failures.
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
