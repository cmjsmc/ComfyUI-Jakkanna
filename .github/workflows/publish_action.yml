name: Publish to Comfy registry
on:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish-node:
    name: Publish Custom Node to registry
    needs: test
    runs-on: ubuntu-latest
    env:
      COMFY_NODE_CHANGELOG: >-
        Stops a bad run before it costs a generation: a tunable frame-zero
        registration floor rejects a body fit that does not land on the
        photographed subject, and the new Validate Sampler node reconciles the
        sigma schedule, sampler, CFG, mode, and LoRA strengths before sampling
        instead of after decode. Reports the timing and root-motion policies
        preparation resolves automatically, collapses the image/FBX workflows
        to one four-input Greenfield graph with the camera preset as its third
        control, makes preparation cancellable with progress, and keeps the
        model hash cache across restarts.
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
