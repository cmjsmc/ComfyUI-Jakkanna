name: Publish to Comfy registry
on:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish-node:
    name: Publish Custom Node to registry
    needs: test
    runs-on: ubuntu-latest
    env:
      COMFY_NODE_CHANGELOG: >-
        Points the package metadata at the repository's MIT LICENSE instead of
        the third-party notices file and restores the OSI license classifier,
        so this listing states the license the package ships under. Blends the
        photograph's pose into the clip on a quintic smootherstep rather than a
        cubic smoothstep, removing the step in acceleration at frame zero, the
        frame the driver is registered against.
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
